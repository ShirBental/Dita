# Dita Kafka spike (prototype only; NOT part of docker/compose.yml or the Maven reactor).
# A SEPARATE compose project: `name: dita-kafka-spike`. Its containers, network (dita-kafka-spike_default) and volume
# (dita-kafka-spike-data) never overlap the `dita` project (dita-pg / dita-neo4j / dita-vespa are untouched).
# Development only, synthetic data only, PLAINTEXT with no auth: bound to 127.0.0.1 only.
#
# IMAGE TAG UNVERIFIED: apache/kafka:4.1.0 is believed to exist but was not checked from the sandbox (no registry access).
# On first pull, pin the digest (trust on first use), as docker/compose.yml does:
#   docker pull apache/kafka:4.1.0
#   docker image inspect apache/kafka:4.1.0 --format '{{index .RepoDigests 0}}'
# then replace the image line below with apache/kafka:4.1.0@sha256:<digest>.
#
# Memory: broker mem_limit 1g (heap 256m..512m) + tools 512m (heap 256m). docker/compose.yml already budgets ~6.3g of a
# 7.75 GiB Docker Desktop VM, so run the spike with neo4j and vespa stopped (see README.md).
name: dita-kafka-spike

x-kafka-image: &kafka-image apache/kafka:4.1.0   # TAG UNVERIFIED, pin digest on first pull

services:
  kafka:
    image: *kafka-image
    hostname: kafka
    ports:
      - "127.0.0.1:${DITA_KAFKA_SPIKE_PORT:-59092}:9092"     # EXTERNAL listener for host clients only
    environment:
      # Single KRaft node acting as broker + controller. Setting any KAFKA_* variable makes the image build its
      # config from the environment only, so every required key is listed.
      CLUSTER_ID: ZGl0YS1rYWZrYS1zcGlrZQ                     # base64url("dita-kafka-spike"), 16 bytes, not a secret
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://127.0.0.1:${DITA_KAFKA_SPIKE_PORT:-59092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - data:/var/lib/kafka/data
    mem_limit: 1g
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "2" }
    healthcheck:
      # The healthcheck JVM inherits the container env, so cap its heap explicitly (else it would also take 512m).
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS=-Xmx64m /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 30s

  # Client tools (perf tests, verifiable producer, console consumer) run here, NOT in the broker container, so that
  # (a) broker memory in `docker stats` is the broker alone and (b) killing the broker does not kill the client.
  tools:
    image: *kafka-image
    init: true
    entrypoint: ["tail", "-f", "/dev/null"]
    environment:
      KAFKA_HEAP_OPTS: "-Xmx256m"
    mem_limit: 512m
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  data:
    name: dita-kafka-spike-data
